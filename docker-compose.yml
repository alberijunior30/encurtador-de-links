services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_PATH: /data/encurtador.sqlite
    volumes:
      - encurtador-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # Host 5173 -> nginx 80. O CORS do backend só aceita http://localhost:5173.
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  encurtador-data:
